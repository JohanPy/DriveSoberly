name: Android release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" "platform-tools" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Sign release APK manually
        id: sign_apk
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Decode keystore from base64
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          
          # Find the unsigned APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Use apksigner from build-tools 35 but zipalign from 34 for zero-padding compatibility.
          APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          ZIPALIGN_BIN=$(find "$SDK_ROOT/build-tools" -name zipalign | sort -V | tail -1)

          if [[ -z "$APKSIGNER_BIN" ]]; then
            echo "apksigner not found in $SDK_ROOT/build-tools"
            exit 1
          fi
          if [[ -z "$ZIPALIGN_BIN" ]]; then
            echo "zipalign not found in $SDK_ROOT/build-tools"
            exit 1
          fi

          # Re-zipalign with 4-byte page alignment (zero padding) before signing.
          # This ensures the padding matches what F-Droid's reproducible build produces.
          "$ZIPALIGN_BIN" -v -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Sign with --alignment-preserved so apksigner keeps the zipalign zero-padding
          # instead of replacing it with "Android ZIP Alignment Extra Field" padding
          # (introduced in build-tools >= 35.0.0-rc1), which breaks apksigcopier.
          "$APKSIGNER_BIN" sign \
            --alignment-preserved \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          # Verify signature
          "$APKSIGNER_BIN" verify --verbose "$SIGNED_APK"
          
          # Store signed APK path for later steps
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Rename signed APK
        id: rename_apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          RELEASE_APK="DriveSoberly-v${VERSION}.apk"
          mv "${{ steps.sign_apk.outputs.signed_apk }}" "$RELEASE_APK"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        run: sha256sum "${{ steps.rename_apk.outputs.release_apk }}" > SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: ${{ steps.rename_apk.outputs.release_apk }}

      - name: Upload SHA256 file
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.rename_apk.outputs.release_apk }}
            SHA256SUMS.txt
          generate_release_notes: false
